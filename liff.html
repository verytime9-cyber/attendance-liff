<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- ⚠️ 防快取設定：告訴所有瀏覽器（含 LINE 內建瀏覽器）這個頁面
       每次都要重新下載，不能沿用舊的快取版本。
       這樣以後每次更新這份檔案，不用再手動加版本號、
       也不用請任何人清 LINE 快取，全部自動生效。 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>考勤打卡系統</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    .title { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 32px; }
    .loader {
      width: 48px; height: 48px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 16px;
      font-weight: 500;
      color: #555;
      line-height: 1.6;
    }
    .status.success { color: #28a745; }
    .status.error { color: #dc3545; }
    .progress {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ddd;
      transition: background 0.3s;
    }
    .dot.active { background: #667eea; }
    .dot.done { background: #28a745; }
    .warning {
      margin-top: 20px;
      padding: 10px 12px;
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 10px;
      font-size: 13px;
      color: #8a6d00;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">📍</div>
    <div class="title" id="title">考勤打卡系統</div>
    <div class="subtitle" id="subtitle">正在為您處理打卡，請稍候...</div>
    <div class="loader" id="loader"></div>
    <div class="status" id="status">初始化中...</div>
    <div class="progress">
      <div class="dot active" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>
    <!-- 🆕 從一開始就持續提醒，不要等到最後才講——因為問題往往發生在
         「資料其實已經送出成功，但畫面還沒跑完最後幾步」的這段空檔，
         等到快結束才提醒已經太晚，員工可能早就把頁面關掉了。
         打卡完成（showResult 執行）後會被隱藏。 -->
    <div class="warning" id="warning">⚠️ 處理中，請勿關閉此頁面或返回聊天室</div>
  </div>

  <script>
    // ⚠️【重要】這個網頁是託管在 GitHub Pages 上的純靜態檔案，
    // GAS 的 <?= ... ?> 樣板語法在這裡「不會」被執行，只會被當成
    // 一般文字送到瀏覽器，所以這裡必須直接寫死真正的 LIFF ID，
    // 不能用 <?= liffId ?> 這種寫法（那是給 GAS doGet() 動態產生
    // 網頁時才有效的語法）。
    // 請至 LINE Developers Console → 你的 LIFF App → 複製 LIFF ID
    // 貼到下面雙引號中間，你原本使用中的真實 ID 大概長這樣：
    // 1234567890-AbCdEfGh
    const LIFF_ID = "2010371883-FlcDCDil";
    document.getElementById('subtitle').textContent = "LIFF ID: " + LIFF_ID;

    // 各動作的顯示文字對照
    const ACTION_LABELS = {
      clockin: "上班簽到",
      clockout: "下班簽退",
      fieldwork: "外勤打卡"
    };

    // 更新進度點
    function setDot(step, state) {
      var dot = document.getElementById("dot" + step);
      if (dot) {
        dot.className = "dot " + state;
      }
    }

    // 更新畫面狀態
    function setStatus(msg, type) {
      document.getElementById("status").textContent = msg;
      document.getElementById("status").className = "status" + (type ? " " + type : "");
    }

    // 顯示最終結果
    function showResult(success, title, msg) {
      document.getElementById("loader").style.display = "none";
      document.getElementById("warning").style.display = "none"; // 流程已結束，不用再提醒了
      document.getElementById("icon").textContent = success ? "✅" : "❌";
      document.getElementById("title").textContent = title;
      document.getElementById("subtitle").textContent = msg;
      document.getElementById("status").textContent = success
        ? "3 秒後自動關閉視窗..."
        : "請關閉視窗後重試，或聯繫主管處理。";
      document.getElementById("status").className = "status " + (success ? "success" : "error");
      setDot(1, "done"); setDot(2, "done"); setDot(3, success ? "done" : "active");
      if (success) {
        setTimeout(function() { liff.closeWindow(); }, 3000);
      }
    }

    async function main() {
      try {
        // Step 1: 初始化 LIFF
        setStatus("步驟 1/3：連接 LINE 身份驗證...");
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        setDot(1, "done"); setDot(2, "active");

        // 取得動作類型
        var urlParams = new URLSearchParams(window.location.search);
        var action = urlParams.get("action") || "clockin";
        var actionLabel = ACTION_LABELS[action] || "打卡";

        document.getElementById("subtitle").textContent = "正在處理「" + actionLabel + "」...";

        // Step 2: 取得 GPS
        setStatus("步驟 2/3：取得您的 GPS 定位...");

        var position = await new Promise(function(resolve, reject) {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          });
        });

        var lat = position.coords.latitude;
        var lng = position.coords.longitude;
        var accuracy = Math.round(position.coords.accuracy);

        setDot(2, "done"); setDot(3, "active");
        setStatus("步驟 3/3：傳送打卡資料...\n(定位精度：±" + accuracy + " 公尺)");

        // 取得使用者 UID
        var profile = await liff.getProfile();
        var uid = profile.userId;

        // Step 3: 傳送給 GAS（透過 Cloudflare Worker）
        // ⚠️【重要】將下方網址換成您的 Cloudflare Worker 網址
        // ⚠️【重要】原始網址少了開頭的 https://，導致 fetch() 把它當成
        // 相對路徑解讀，實際變成對 GitHub Pages 自己發送 POST 請求，
        // 而 GitHub Pages 是純靜態網站、只能回應 GET，收到 POST 一律
        // 回傳 405 Method Not Allowed——這正是之前測試一直失敗的根本原因。
        var POST_URL = "https://line-attendance-proxy.verytime9.workers.dev";

        var payload = {
          liffData: {
            action: action,
            uid: uid,
            lat: lat,
            lng: lng,
            accuracy: accuracy
          }
        };

        var response = await fetch(POST_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error("伺服器回應錯誤：" + response.status);
        }

        var resultData = await response.json();

        // ⚠️ result.success 才是真正的成功/失敗依據，response.ok 只代表
        // 「伺服器有正常回應」，不代表「打卡本身有成功」，這兩件事完全不同。
        // 之前這裡沒有分開判斷，導致超出範圍打卡失敗時，畫面依然顯示「完成！」，
        // 員工完全不知道其實沒有打卡成功。
        var r = resultData && resultData.result;

        if (r && r.success) {
          // 🛠️ 2026/9/2 起：把「這次打卡的成功確認」提到最前面優先送出，
          // 不再跟待補送通知搶順序。原因：先前是待補送通知先送、
          // 打卡確認後送，如果員工在這段等待期間提早關閉頁面或滑回
          // 聊天室，最重要的「這次打卡成功」訊息反而是最後才送、
          // 最容易被中斷、完全沒送出——但後端其實已經正常寫入成功了，
          // 員工卻完全不知道。現在改成最重要的訊息最先送，
          // 就算後面待補送通知那步真的被中斷，頂多是那批通知這次
          // 沒送到（它們還留在 Pending_Notifications，下次還有機會
          // 補送，或下次查詢出勤紀錄時也會夾帶），不會犧牲掉這次
          // 打卡本身的確認。
          // 訊息會顯示成「以您自己身份發送」，這是 liff.sendMessages() 的
          // 固定行為，跟官方帳號主動推播的樣式不同，屬預期內。
          // 就算這則訊息發送失敗，也不影響打卡本身已經成功寫入的事實，
          // 所以整個包在 try/catch 裡，失敗只記錄不阻擋畫面顯示。
          try {
            await liff.sendMessages([{
              type: "text",
              text:
                "✅ " + r.actionLabel + "成功！\n\n" +
                "👤 " + r.name + "\n" +
                "🆔 員編：" + r.empId + "\n" +
                "📍 據點：" + r.locationName + "\n" +
                "🕐 時間：" + r.timeStr + "\n" +
                "📏 距離中心點：" + r.distance + " 公尺\n" +
                "🎯 GPS 精度：±" + r.accuracy + " 公尺"
            }]);
          } catch (sendErr) {
            console.log("liff.sendMessages 失敗（不影響打卡結果）：", sendErr);
          }

          // ⚠️ 待補送通知：之前因為 LINE 額度用完而卡住、沒能即時送達的
          // 請假/補簽/加班審核通知，這裡順便補送進聊天室（免額度）。
          // 跟這次打卡本身成功或失敗無關，只要有積壓的通知就會補送。
          // 刻意放在打卡成功確認「之後」，理由見上方說明。
          var pending = resultData && resultData.pendingNotifications;
          var pendingRows = resultData && resultData.pendingRows;
          if (pending && pending.length > 0) {
            try {
              // liff.sendMessages() 一次最多 5 則，這裡做個保護上限
              // （pendingRows 用同樣的切法，確保列號跟訊息內容對得上）
              var sendCount = Math.min(pending.length, 5);
              var toSend = pending.slice(0, sendCount).map(function(text) {
                return { type: "text", text: "【補送通知】\n" + text };
              });
              await liff.sendMessages(toSend);

              // 🛠️ 2026/9/2 起：liff.sendMessages() 沒有拋出例外，代表這批
              // 待補送通知已經真的送出成功，這時候才回報伺服器把對應的
              // 列號標記已送達（見 GAS 的 confirmPendingDelivered 分流）。
              // 這一步失敗完全不影響員工體驗（畫面已經顯示成功了），
              // 頂多下次還會再看到一次這批通知，所以同樣包在 try/catch
              // 裡，失敗只記錄不處理。
              if (pendingRows && pendingRows.length > 0) {
                try {
                  await fetch(POST_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      confirmPendingDelivered: {
                        uid: uid,
                        rows: pendingRows.slice(0, sendCount)
                      }
                    })
                  });
                } catch (confirmErr) {
                  console.log("回報待補送通知已送達失敗（下次還會再收到一次，不影響本次打卡）：", confirmErr);
                }
              }
            } catch (pendingErr) {
              console.log("補送待處理通知失敗：", pendingErr);
            }
          }

          showResult(true, actionLabel + " 完成！",
            "打卡資料已成功送出。\n\n請確認 LINE 聊天室是否收到本次打卡通知，若沒有看到通知，請聯繫主管確認紀錄。"
          );

        } else if (r && r.success === false) {
          // 明確的業務邏輯失敗（例如超出打卡範圍），不是網路或系統錯誤，
          // 直接把後端算出來的距離資訊顯示給員工看，不用等 LINE 通知
          // （額度不夠時 LINE 通知本來就可能收不到，畫面上這裡才是最終保障）。
          showResult(false, actionLabel + " 失敗",
            "您目前位置距離「" + r.locationName + "」約 " + r.distance + " 公尺，" +
            "超出允許範圍（" + r.allowedRadius + " 公尺）。\n\n若您正在外勤，請改點「外勤打卡」。"
          );

        } else {
          // 沒有明確 result（例如查無綁定資料等其他例外狀況），顯示通用失敗訊息
          showResult(false, actionLabel + " 失敗", "系統未能確認打卡結果，請查看 LINE 訊息或聯繫主管確認。");
        }

      } catch (err) {
        document.getElementById("loader").style.display = "none";

        if (err.code === 1) {
          // 使用者拒絕定位
          showResult(false, "無法取得定位", "請至手機「設定 → LINE → 位置資訊」開啟定位權限後重試。");
        } else if (err.code === 2) {
          // 定位不可用
          showResult(false, "定位服務異常", "請確認手機 GPS 已開啟，並在室外或靠近窗戶的位置重試。");
        } else if (err.code === 3) {
          // 定位逾時
          showResult(false, "定位逾時", "GPS 訊號不穩，請移至戶外或靠近窗戶後重試。");
        } else {
          showResult(false, "系統錯誤", err.message || "未知錯誤，請截圖此畫面並聯繫系統管理員。");
        }
      }
    }

    main();
  </script>
</body>
</html>
